name: JEFATURA MID MARC - GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_BASE: ${{ vars.APP_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar variables públicas (sin mostrarlas)
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo 'ERROR: Configura SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY en GitHub > Variables (no Secrets).'
            exit 1
          fi
          if [ -z "$VITE_APP_BASE" ]; then echo 'ERROR: Configura APP_BASE=/marc-mid/'; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar proyecto
        run: npm run check && npm test
      - name: Compilar interfaz Supabase
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
